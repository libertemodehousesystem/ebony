<div class="customersearchdialogback">
  <div class="dialogwindow">
    <div class="dlgtitle">検索</div>
    <div class="itemfield">
      <label>氏名(一文字以上を入れてください）</label>
      <div class="searchname">
        <div class="searchnameinner">
          <input type="text" [(ngModel)]="searchletter" />
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" (click)="dofilter()">
            <path d="M0 0h24v24H0V0z" fill="none" />
            <path
              d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            />
          </svg>
        </div>
      </div>
      <div></div>
    </div>
    <div class="resultcustomer">
      <div class="customertable">
        @if (filteredcustomers().length > 0) {
          <div class="customerrow">
            <div class="customercell cellheader">氏名</div>
            <div class="customercell cellheader">電話番号</div>
          </div>
        }
        @for (customer of filteredcustomers(); track customer) {
          <div class="customerrow canselect" (click)="selectcustomer(customer)">
            <div class="customercell">
              <ruby
                >{{ customer.customer_family_name
                }}<rt>{{ customer.customer_family_kn_name }}</rt></ruby
              >&nbsp;
              <ruby
                >{{ customer.customer_given_name
                }}<rt>{{ customer.customer_given_kn_name }}</rt></ruby
              >
            </div>
            <div class="customercell">{{ filteredphone(customer.phone) }}</div>
          </div>
        }
      </div>
    </div>
    <button (click)="closedialog()">閉じる</button>
  </div>
</div>
