<div class="menubararea">
  <div class="menuicon">
    <svg
      class="menusvg"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      (click)="burgermenuaction()"
    >
      <path d="M0 0h24v24H0V0z" fill="none" />
      <path
        d="M4 18h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1s.45 1 1 1zm0-5h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1s.45 1 1 1zM3 7c0 .55.45 1 1 1h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1z"
      />
    </svg>
  </div>
  <div class="logoarea">
    <div class="logopng"></div>
    <div class="logoletteral"></div>
  </div>
  <div class="userbox">
    <!-- <div class="cart">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M0 0h24v24H0V0z" fill="none"/>
      <path d="M15.55 13c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.37-.66-.11-1.48-.87-1.48H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2h7.45zM6.16 6h12.15l-2.76 5H8.53L6.16 6zM7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
    </svg>
  </div> -->
    @if (signined()) {
      <div>
        <div class="usermail" (click)="userinfoappearance()">{{ tailoruser()?.email }}</div>
      </div>
    }
    @if (!signined()) {
      <div>
        <button class="signinbutton" (click)="opensignindialog()">サインイン</button>
      </div>
    }
    <div class="userinfobox" [style.visibility]="userinfoboxvisibility()">
      <div class="usermenutitle">ユーザーメニュー</div>
      <button class="signoutbutton" (click)="signout()">サインアウト</button>
    </div>
  </div>
</div>

<div #BurgerMenu id="burgermenuelement" class="burgermenuback" (click)="burgermenuaction()">
  <div class="burgermenubox" (click)="nonpropagation($event)">
    <div class="burgermenuitem" (click)="gototop()">トップページに戻る</div>
    @if (cansettings()) {
      <div class="burgermenuitem" (click)="gotoreceipt()">領収書発行</div>
    }
    @if (cansettings()) {
      <div class="burgermenuitem" (click)="pagerouting('settings')">設定</div>
    }
    <!-- <div *ngIf="cansettings" class="burgermenuitem" (click)="pagerouting('study')">試験</div> -->
  </div>
</div>

@if (signindisplay()) {
  <div class="dialogback">
    <div class="dialogwindow">
      <div class="dlgtitle">サインイン</div>
      <div class="dlgcontent">
        <div class="itemfield">
          <label>メールアドレス</label>
          <input type="text" class="mailaddress" [(ngModel)]="preemail" />
          <span>{{ mailaddressdomain }}</span>
        </div>
        <div class="itemfield">
          <label>パスワード</label>
          <input type="password" class="password" [(ngModel)]="prepassword" />
        </div>
      </div>
      <div class="dlgaction">
        <button (click)="dosignin()">サインイン</button>
        <button (click)="closesignindialog()">閉じる</button>
      </div>
    </div>
  </div>
}
